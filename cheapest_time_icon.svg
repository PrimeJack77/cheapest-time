<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F4A300"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- clock face -->
  <circle cx="128" cy="132" r="80" fill="none" stroke="#8FB4FF" stroke-width="10"/>

  <!-- tick marks -->
  <g stroke="#8FB4FF" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="60" x2="128" y2="72"/>
    <line x1="128" y1="192" x2="128" y2="204"/>
    <line x1="56" y1="132" x2="68" y2="132"/>
    <line x1="188" y1="132" x2="200" y2="132"/>
  </g>

  <!-- clock hands pointing to a "cheap" moment -->
  <g stroke="#EAF1FF" stroke-linecap="round">
    <line x1="128" y1="132" x2="128" y2="86" stroke-width="9"/>
    <line x1="128" y1="132" x2="160" y2="150" stroke-width="9"/>
  </g>
  <circle cx="128" cy="132" r="7" fill="#EAF1FF"/>

  <!-- lightning bolt (price / energy) badge -->
  <circle cx="186" cy="184" r="46" fill="#0E1830" stroke="#1B2A4A" stroke-width="4"/>
  <path d="M195 148 L163 192 H183 L177 220 L211 176 H190 Z" fill="url(#bolt)"/>
</svg>
